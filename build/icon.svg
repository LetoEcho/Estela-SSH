<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22324a"/>
      <stop offset="1" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="trail" x1="236" y1="262" x2="392" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a90d9" stop-opacity="0.15"/>
      <stop offset="0.7" stop-color="#56b6c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e5f3ff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- comet trail (the "estela") -->
  <path d="M236 262 C 290 230, 350 180, 392 128" stroke="url(#trail)" stroke-width="30" stroke-linecap="round" fill="none"/>
  <circle cx="396" cy="124" r="30" fill="#e5f3ff"/>
  <!-- prompt -->
  <path d="M112 196 L 196 256 L 112 316" stroke="#e5f3ff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="220" y="300" width="120" height="30" rx="15" fill="#50b86c"/>
